[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "cortex-context-stamps"
version = "0.2.0"
description = "Portable context fingerprints and local, version-aware evidence selection"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Prashant Jagtap"}]
dependencies = []
keywords = ["agent-memory", "embeddings", "context", "binary-retrieval", "edge"]

[project.optional-dependencies]
learn = ["numpy>=1.24,<3"]
semantic = ["sentence-transformers>=3,<6"]
tokens = ["tiktoken>=0.7,<1"]
mcp = ["mcp>=1.12,<2"]
experiment = ["numpy>=1.25,<3", "sentence-transformers>=3,<6", "faiss-cpu>=1.10,<2", "psutil>=6,<8", "matplotlib>=3.9,<4"]

dev = ["build>=1.2", "ruff>=0.9", "numpy>=1.24,<3"]

[project.scripts]
cstamps = "context_stamps.cli:main"

[project.urls]
Repository = "https://github.com/jprbom/context-stamps"
Issues = "https://github.com/jprbom/context-stamps/issues"

[tool.setuptools]
packages = ["context_stamps"]
py-modules = ["stamps"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
