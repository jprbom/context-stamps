name: Tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  core:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[dev,mcp,tokens]"
      - run: python -m unittest discover -s tests -v
      - run: python -m ruff check .
      - run: python stamps.py --demo
      - run: python examples/offline_memory.py
      - run: python examples/local_slm.py --dry-run
      - run: python benchmarks/retrieval.py --out results.json
      - run: python -m build
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[learn,mcp,tokens]" bandit pip-audit
      - run: python -m bandit -r context_stamps stamps.py -q
      - run: python -m pip_audit --skip-editable
