name: Tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  core:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[dev,mcp,tokens]"
      - run: python -m unittest discover -s tests -v
      - run: python -m ruff check .
      - run: python stamps.py --demo
      - run: python examples/offline_memory.py
      - run: python examples/local_slm.py --dry-run
      - run: python benchmarks/retrieval.py --out results.json
      - run: python -m build
