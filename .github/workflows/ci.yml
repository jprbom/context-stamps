name: Tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  core:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[dev,mcp,tokens]"
      - run: python -m unittest discover -s tests -v
      - run: python -m ruff check .
      - run: python experiments/verify_evidence.py
      - run: python experiments/verify_followup.py
      - run: python experiments/verify_spherical.py
      - run: python experiments/verify_candidate.py
      - run: python experiments/verify_public_spherical.py
      - run: python experiments/verify_improvements.py
      - run: python experiments/verify_progressive.py
      - run: python experiments/verify_mutation_reuse.py
      - run: python experiments/verify_capsule_controls.py
      - run: python experiments/verify_hybrid_retrieval.py
      - run: python experiments/verify_controller.py
      - run: python experiments/verify_controller_v2.py
      - run: python experiments/verify_runtime.py
      - run: python experiments/verify_enterprise_foundations.py
      - run: python experiments/verify_enterprise_state.py
      - run: python experiments/verify_context_precision.py
      - run: python experiments/verify_audit.py
      - run: python experiments/verify_execution.py
      - run: python experiments/verify_storage.py
      - run: python experiments/verify_incremental.py
      - run: python experiments/verify_acquisition.py
      - run: python experiments/test_local_eval.py -v
      - run: python experiments/test_longbench_eval.py -v
      - run: python experiments/verify_longbench.py
      - run: python experiments/verify_harbor_preflight.py
      - run: python experiments/verify_local_learning.py
      - run: python experiments/test_terminal_pilot.py -v
      - run: python experiments/verify_terminal_pilot.py
      - run: python experiments/verify_terminal_reference.py
      - run: python experiments/test_terminal_tools.py -v
      - run: python experiments/verify_typed_terminal.py
      - run: python stamps.py --demo
      - run: python examples/offline_memory.py
      - run: python examples/changing_evidence.py
      - run: python examples/spherical_workflow.py
      - run: python examples/zip_spherical_qr.py
      - run: python examples/residual_retrieval.py
      - run: python examples/progressive_context.py
      - run: python examples/partial_facets.py
      - run: python examples/automatic_facets.py
      - run: python examples/relation_aware_routing.py
      - run: python examples/computation_reuse.py
      - run: python examples/unified_context.py
      - run: python examples/enterprise_decision.py
      - run: python examples/audited_decision.py
      - run: python examples/managed_decision.py
      - run: python examples/persistent_context.py
      - run: python examples/incremental_metrics.py
      - run: python examples/local_learning.py
      - run: python examples/adaptive_acquisition.py --model evidence/acquisition-v1/mlp32-seed29.json
      - run: scqr encode examples/facets.json
      - run: python examples/local_slm.py --dry-run
      - run: python benchmarks/retrieval.py --out results.json
      - run: python -m build
  controller:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - run: python -m pip install torch==2.11.0 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -e . numpy safetensors
      - run: python -m unittest discover -s tests -p 'test_*controller.py' -v
      - run: python -m unittest discover -s tests -p 'test_efficient_reranker.py' -v
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[learn,mcp,tokens]" bandit pip-audit
      - run: python -m bandit -r context_stamps stamps.py -q
      - run: python -m pip_audit --skip-editable
      - name: Install pinned secret scanner
        shell: bash
        run: |
          curl --fail --silent --show-error --location --retry 3 https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o "$RUNNER_TEMP/gitleaks.tar.gz"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
      - name: Verify secret scanner exclusions and positive controls
        run: python experiments/verify_secret_scan.py --gitleaks "$RUNNER_TEMP/gitleaks"
      - name: Scan repository files
        run: '"$RUNNER_TEMP/gitleaks" dir . --config .gitleaks.toml --redact'
