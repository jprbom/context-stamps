title = "Context Stamps: exact public identifier and checksum exceptions"

[[allowlists]]
description = "Exact verified public tokenizer bytes in four fictional citation registrations"
targetRules = ["generic-api-key"]
condition = "AND"
regexTarget = "match"
paths = ['''(^|[\\/])evidence[\\/]citations-v1[\\/](original|revised)_small[\\/]registration\.json$''']
